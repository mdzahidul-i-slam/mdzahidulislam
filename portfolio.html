*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:"DM Sans",sans-serif;background:radial-gradient(circle at 15% 10%,rgba(42,157,143,.15),transparent 30%),radial-gradient(circle at 90% 15%,rgba(38,70,83,.22),transparent 35%),var(--bg);color:var(--text);line-height:1.6}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.25)}.grad{background:linear-gradient(90deg,#fff,var(--p2));-webkit-background-clip:text;color:transparent}.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:999px;font-weight:800;transition:.25s}.btn-primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#06211d}.btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 35px rgba(42,157,143,.25)}.btn-outline{border:1px solid var(--line);background:rgba(255,255,255,.03)}.btn-outline:hover{transform:translateY(-3px)}header{position:fixed;top:0;left:0;right:0;z-index:20;padding:15px 0}.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--s))}.menu{display:flex;gap:24px;align-items:center}.menu a{font-size:.92rem;color:var(--muted);font-weight:700}.menu a:hover,.menu a.active{color:var(--p2)}.mobile{display:none}.hero{min-height:100vh;padding:145px 0 70px;display:grid;align-items:center}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:55px;align-items:center}.eyebrow{color:var(--p2);font-weight:800;letter-spacing:.12em;font-size:.8rem;text-transform:uppercase}.hero h1{font-size:clamp(3rem,6.5vw,6rem);line-height:.98;margin-top:12px}.role{font-size:1.15rem;color:var(--p2);font-weight:800;margin:22px 0}.copy,.muted{color:var(--muted)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.socials{display:flex;gap:10px;margin-top:20px}.social{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}.social:hover{color:var(--p2);transform:translateY(-3px)}.portrait-wrap{position:relative;display:grid;place-items:center}.orb{position:absolute;width:430px;height:430px;border-radius:50%;background:radial-gradient(circle,rgba(42,157,143,.35),transparent 68%);animation:float 7s ease-in-out infinite}.portrait{position:relative;width:min(420px,90vw);aspect-ratio:1/1.12;border-radius:34px;overflow:hidden;z-index:2}.portrait img{width:100%;height:100%;object-fit:cover}.float{position:absolute;z-index:3;padding:12px 15px;border-radius:15px;display:flex;gap:9px;align-items:center}.float.left{left:0;bottom:35px}.float.right{right:0;top:35px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}.stat{padding:18px;border-radius:18px}.stat b{font-size:1.7rem}.stat span{display:block;color:var(--muted);font-size:.78rem}.section{padding:100px 0}.section-title{font-size:clamp(2.2rem,5vw,4rem);line-height:1.05;margin-top:10px}.section-sub{color:var(--muted);max-width:700px;margin-top:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:35px}.card{padding:24px;border-radius:24px}.card:hover{transform:translateY(-6px);transition:.25s}.icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(42,157,143,.13);color:var(--p2);font-size:1.3rem;margin-bottom:18px}.list{list-style:none;margin-top:14px}.list li{color:var(--muted);font-size:.88rem;margin:7px 0}.list i{color:var(--p2);margin-right:7px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.filter{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}.filter.active{background:rgba(42,157,143,.12);color:var(--p2)}.projects{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.project{overflow:hidden;border-radius:20px}.project img{width:100%;aspect-ratio:1.15;object-fit:cover;transition:1s}.project:hover img{transform:scale(1.08)}.project-info{padding:15px}.project-info small{color:var(--p2)}.about-grid,.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:25px}.about-img{border-radius:26px;overflow:hidden}.about-img img{width:100%;aspect-ratio:1/1.15;object-fit:cover}.timeline{margin-top:24px;padding-left:17px;border-left:1px solid var(--line)}.timeline div{padding:0 0 22px 20px;position:relative}.timeline div:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--p)}.skill{margin-top:17px}.skill-top{display:flex;justify-content:space-between}.bar{height:8px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2))}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{width:100%;padding:14px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);border-radius:14px;outline:none}.field:focus{border-color:var(--p)}textarea.field{min-height:160px;resize:vertical}.contact-item{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:12px}.contact-item i{color:var(--p2);margin-top:4px}.map{overflow:hidden;border-radius:20px;margin-top:18px}.map iframe{width:100%;height:280px;border:0;filter:grayscale(1) brightness(.7)}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted)}.reveal{animation:rise .7s ease both}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-17px)}}@media(max-width:1000px){.grid4,.projects{grid-template-columns:repeat(2,1fr)}.hero-grid,.about-grid,.contact-grid{grid-template-columns:1fr}.portrait-wrap{order:-1}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.menu{display:none;position:absolute;top:76px;left:4%;right:4%;flex-direction:column;padding:18px;border-radius:18px;background:#0b1821}.menu.open{display:flex}.mobile{display:grid;width:40px;height:40px;border-radius:12px;background:transparent;border:1px solid var(--line);color:var(--text);place-items:center}.hire{display:none}}@media(max-width:560px){.grid4,.projects,.form-grid{grid-template-columns:1fr}.hero{padding-top:120px}.stats{grid-template-columns:1fr 1fr}.orb{width:300px;height:300px}.portrait{width:300px}.float.left{left:0}.float.right{right:0}}
</style></head><body>

<section class="section" style="padding-top:150px"><div class="container"><div class="eyebrow">Selected Work</div><h1 class="section-title">My <span class="grad">Portfolio</span></h1><p class="section-sub">20 project slots ready for your real work.</p>
<div class="filters">
<button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Graphic Design">Graphic Design</button><button class="filter" data-filter="Web Development">Web Development</button><button class="filter" data-filter="SEO">SEO</button><button class="filter" data-filter="Digital Marketing">Digital Marketing</button>
</div><div class="projects" id="projects"></div></div></section>
</main><footer><div class="container" style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap">
<div>© <span data-year></span> <span data-name>Md Zahidul Islam</span>. All rights reserved.</div>
<div>Graphic Design • Web Development • SEO • Digital Marketing</div>
</div></footer><script>
const DATA={
 name:"Md Zahidul Islam", shortName:"ZI", email:"zahidroton567@gmail.com",
 location:"Kushtia, Dhaka, Bangladesh", started:"March 2021", experience:"6+", projects:"25+",
 profileImage:"https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=1000&q=85",
 social:{facebook:"#",linkedin:"#",instagram:"#",github:"#"}
};
document.querySelectorAll("[data-name]").forEach(e=>e.textContent=DATA.name);
document.querySelectorAll("[data-email]").forEach(e=>e.textContent=DATA.email);
document.querySelectorAll("[data-location]").forEach(e=>e.textContent=DATA.location);
document.querySelectorAll("[data-photo]").forEach(e=>e.src=DATA.profileImage);
document.querySelectorAll("[data-social]").forEach(e=>e.href=DATA.social[e.dataset.social]);
document.querySelectorAll("[data-year]").forEach(e=>e.textContent=new Date().getFullYear());
const mb=document.querySelector(".mobile"), menu=document.querySelector(".menu");
if(mb) mb.onclick=()=>menu.classList.toggle("open");
</script>
<script>
const projects=Array.from({length:20},(_,i)=>({title:["Brand Identity","Business Website","SEO Campaign","Social Media Design","Landing Page"][i%5]+" Project "+(i+1),cat:["Graphic Design","Web Development","SEO","Digital Marketing"][i%4],img:`https://picsum.photos/seed/zahid-project-${i+1}/1000/800`}));
const box=document.getElementById("projects");
function render(filter="All"){box.innerHTML=projects.filter(p=>filter==="All"||p.cat===filter).map(p=>`<article class="project glass"><img src="${p.img}" alt="${p.title}" loading="lazy"><div class="project-info"><small>${p.cat}</small><h3>${p.title}</h3><span class="muted">Live Preview →</span></div></article>`).join("")}
render();
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.filter)});
</script>
